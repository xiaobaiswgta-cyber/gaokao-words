<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考高频词汇复习</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2B2A26">
<style>
  :root{
    --paper:#FBF7ED;
    --paper2:#F4EEDD;
    --ink:#2B2A26;
    --ink-soft:#6B6559;
    --line:#DFD6BE;
    --hi:#F6D746;
    --hi-ink:#5C4A00;
    --mint:#B7E4C7;
    --mint-ink:#1B5E3A;
    --coral:#F4A79D;
    --coral-ink:#7A2A1E;
    --card:#FFFFFF;
    --shadow: 2px 3px 0 rgba(43,42,38,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 35px, var(--line) 36px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  header h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  header h1 span{
    background:linear-gradient(180deg, transparent 60%, var(--hi) 60%);
    padding:0 3px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:13px;}
  .stats{display:flex;gap:10px;}
  .stat{
    background:var(--card);
    border:1.5px solid var(--ink);
    box-shadow:var(--shadow);
    padding:8px 14px;
    text-align:center;
    min-width:64px;
  }
  .stat b{display:block;font-size:20px;line-height:1.1;}
  .stat span{font-size:11px;color:var(--ink-soft);}

  nav.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:inherit;
    font-size:14px;
    padding:9px 18px;
    border:1.5px solid var(--ink);
    background:var(--card);
    cursor:pointer;
    box-shadow:var(--shadow);
    color:var(--ink);
  }
  nav.tabs button.active{
    background:var(--ink);
    color:var(--paper);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  /* --- Flashcard mode --- */
  .flash-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .flash-progress{font-size:13px;color:var(--ink-soft);}
  .flashcard{
    width:100%;
    max-width:440px;
    min-height:230px;
    background:var(--card);
    border:2px solid var(--ink);
    box-shadow:5px 6px 0 rgba(43,42,38,0.15);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:26px;
    cursor:pointer;
    position:relative;
  }
  .flashcard .tag{
    position:absolute;
    top:12px;
    left:14px;
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:2px 8px;
  }
  .flashcard .word{
    font-family:Georgia,"Times New Roman",serif;
    font-size:38px;
    margin-bottom:10px;
  }
  .flashcard .pos{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  .flashcard .meaning{
    font-size:20px;
    display:none;
    line-height:1.6;
  }
  .flashcard.flipped .word{font-size:24px;color:var(--ink-soft);}
  .flashcard.flipped .meaning{display:block;}
  .flashcard .hint{position:absolute;bottom:10px;font-size:11px;color:var(--ink-soft);}

  .flash-btns{display:flex;gap:10px;}
  .flash-btns button{
    font-family:inherit;
    font-size:14px;
    padding:10px 18px;
    border:1.5px solid var(--ink);
    background:var(--card);
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .btn-know{background:var(--mint);color:var(--mint-ink);border-color:var(--mint-ink);}
  .btn-unknow{background:var(--coral);color:var(--coral-ink);border-color:var(--coral-ink);}

  /* --- List mode --- */
  .list-controls{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .list-controls input[type=text]{
    flex:1;
    min-width:180px;
    padding:9px 12px;
    border:1.5px solid var(--ink);
    background:var(--card);
    font-family:inherit;
    font-size:14px;
  }
  .list-controls select{
    padding:9px 12px;
    border:1.5px solid var(--ink);
    background:var(--card);
    font-family:inherit;
    font-size:14px;
  }
  .word-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:10px;
  }
  .word-card{
    background:var(--card);
    border:1.5px solid var(--ink);
    box-shadow:var(--shadow);
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .word-card .info .w{font-weight:bold;font-size:16px;}
  .word-card .info .p{font-size:11px;color:var(--ink-soft);}
  .word-card .info .m{font-size:13px;margin-top:2px;}
  .word-card button{
    border:1px solid var(--ink);
    background:var(--paper2);
    width:30px;height:30px;
    cursor:pointer;
    font-size:15px;
    flex-shrink:0;
  }
  .word-card.mastered{border-color:var(--mint-ink);}
  .word-card.mastered button{background:var(--mint);}
  .empty-msg{color:var(--ink-soft);text-align:center;padding:30px;font-size:14px;}

  /* --- Quiz mode --- */
  .quiz-box{
    max-width:480px;
    margin:0 auto;
    background:var(--card);
    border:2px solid var(--ink);
    box-shadow:5px 6px 0 rgba(43,42,38,0.15);
    padding:26px;
    text-align:center;
  }
  .quiz-box .qmeaning{font-size:20px;margin-bottom:6px;}
  .quiz-box .qpos{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .quiz-box input{
    width:100%;
    padding:10px 12px;
    font-size:16px;
    border:1.5px solid var(--ink);
    font-family:inherit;
    margin-bottom:12px;
  }
  .quiz-box .qbtns{display:flex;gap:10px;justify-content:center;}
  .quiz-box button{
    font-family:inherit;
    font-size:14px;
    padding:9px 16px;
    border:1.5px solid var(--ink);
    background:var(--paper2);
    cursor:pointer;
  }
  .quiz-feedback{margin-top:12px;font-size:14px;min-height:20px;}
  .quiz-feedback.correct{color:var(--mint-ink);}
  .quiz-feedback.wrong{color:var(--coral-ink);}
  .quiz-score{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:14px;}

  footer{
    margin-top:40px;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
  }
  @media(max-width:520px){
    header h1{font-size:24px;}
    .flashcard .word{font-size:28px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>高考高频</span>英语词汇</h1>
      <p id="subtitle">共 0 词 · 点击卡片查看释义，标记掌握进度</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>总词数</span></div>
      <div class="stat"><b id="statMastered">0</b><span>已掌握</span></div>
      <div class="stat"><b id="statLeft">0</b><span>待复习</span></div>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="flash" class="active">闪卡背诵</button>
    <button data-tab="list">单词列表</button>
    <button data-tab="quiz">拼写测试</button>
  </nav>

  <section id="panel-flash" class="panel active">
    <div class="flash-area">
      <div class="flash-progress" id="flashProgress"></div>
      <div class="flashcard" id="flashcard">
        <div class="tag" id="flashTag">未掌握</div>
        <div class="word" id="flashWord">word</div>
        <div class="pos" id="flashPos">n.</div>
        <div class="meaning" id="flashMeaning">释义</div>
        <div class="hint">点击卡片翻面</div>
      </div>
      <div class="flash-btns">
        <button class="btn-unknow" id="btnUnknow">✗ 还不熟</button>
        <button id="btnSkip">下一个 →</button>
        <button class="btn-know" id="btnKnow">✓ 已掌握</button>
      </div>
    </div>
  </section>

  <section id="panel-list" class="panel">
    <div class="list-controls">
      <input type="text" id="searchInput" placeholder="搜索单词或释义...">
      <select id="filterSelect">
        <option value="all">全部</option>
        <option value="mastered">已掌握</option>
        <option value="unmastered">未掌握</option>
      </select>
    </div>
    <div class="word-grid" id="wordGrid"></div>
  </section>

  <section id="panel-quiz" class="panel">
    <div class="quiz-score" id="quizScore">得分 0 / 0</div>
    <div class="quiz-box">
      <div class="qmeaning" id="quizMeaning">释义</div>
      <div class="qpos" id="quizPos">n.</div>
      <input type="text" id="quizInput" placeholder="请输入对应的英语单词" autocomplete="off">
      <div class="qbtns">
        <button id="quizSubmit">提交</button>
        <button id="quizNext">跳过 →</button>
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
    </div>
  </section>

  <footer>共 688 词，为高频词精选合集，按词形难度粗略排序（非官方真题词频统计），建议结合课本大纲词表交叉复习。进度仅保存在当前浏览会话中，刷新页面会重置。</footer>
</div>

let mastered = new Set();
let currentFlashIndex = 0;
let flashOrder = [];
let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;
let quizAsked = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function updateStats(){
  document.getElementById('statTotal').textContent = WORDS.length;
  document.getElementById('statMastered').textContent = mastered.size;
  document.getElementById('statLeft').textContent = WORDS.length - mastered.size;
  document.getElementById('subtitle').textContent = `共 ${WORDS.length} 词 · 已掌握 ${mastered.size} 个 · 点击卡片查看释义`;
}

/* ---- Flashcard mode ---- */
function initFlash(){
  flashOrder = shuffle(WORDS.map((_,i)=>i));
  currentFlashIndex = 0;
  showFlash();
}
function showFlash(){
  const card = document.getElementById('flashcard');
  card.classList.remove('flipped');
  if(flashOrder.length === 0){
    document.getElementById('flashWord').textContent = '暂无单词';
    document.getElementById('flashPos').textContent = '';
    document.getElementById('flashMeaning').textContent = '';
    document.getElementById('flashProgress').textContent = '';
    return;
  }
  if(currentFlashIndex >= flashOrder.length) currentFlashIndex = 0;
  const idx = flashOrder[currentFlashIndex];
  const [w,pos,meaning] = WORDS[idx];
  document.getElementById('flashWord').textContent = w;
  document.getElementById('flashPos').textContent = pos;
  document.getElementById('flashMeaning').textContent = meaning;
  document.getElementById('flashTag').textContent = mastered.has(idx) ? '已掌握' : '未掌握';
  document.getElementById('flashProgress').textContent = `第 ${currentFlashIndex+1} / ${flashOrder.length} 个`;
}
function nextFlash(){
  currentFlashIndex++;
  if(currentFlashIndex >= flashOrder.length) currentFlashIndex = 0;
  showFlash();
}
document.getElementById('flashcard').addEventListener('click', ()=>{
  document.getElementById('flashcard').classList.toggle('flipped');
});
document.getElementById('btnKnow').addEventListener('click', ()=>{
  mastered.add(flashOrder[currentFlashIndex]);
  updateStats();
  renderList();
  nextFlash();
});
document.getElementById('btnUnknow').addEventListener('click', ()=>{
  mastered.delete(flashOrder[currentFlashIndex]);
  updateStats();
  renderList();
  nextFlash();
});
document.getElementById('btnSkip').addEventListener('click', nextFlash);

/* ---- List mode ---- */
function renderList(){
  const grid = document.getElementById('wordGrid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filter = document.getElementById('filterSelect').value;
  grid.innerHTML = '';
  let count = 0;
  WORDS.forEach((item, idx)=>{
    const [w,pos,meaning] = item;
    if(q && !w.toLowerCase().includes(q) && !meaning.includes(q)) return;
    const isMastered = mastered.has(idx);
    if(filter==='mastered' && !isMastered) return;
    if(filter==='unmastered' && isMastered) return;
    count++;
    const card = document.createElement('div');
    card.className = 'word-card' + (isMastered ? ' mastered' : '');
    card.innerHTML = `<div class="info"><span class="w">${w}</span> <span class="p">${pos}</span><div class="m">${meaning}</div></div>
      <button title="切换掌握状态">${isMastered ? '✓' : '○'}</button>`;
    card.querySelector('button').addEventListener('click', ()=>{
      if(mastered.has(idx)) mastered.delete(idx); else mastered.add(idx);
      updateStats();
      renderList();
    });
    grid.appendChild(card);
  });
  if(count===0){
    grid.innerHTML = '<div class="empty-msg">没有找到匹配的单词</div>';
  }
}
document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('filterSelect').addEventListener('change', renderList);

/* ---- Quiz mode ---- */
function initQuiz(){
  quizOrder = shuffle(WORDS.map((_,i)=>i));
  quizIndex = 0;
  quizScore = 0;
  quizAsked = 0;
  showQuiz();
}
function showQuiz(){
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizFeedback').className = 'quiz-feedback';
  document.getElementById('quizInput').value = '';
  document.getElementById('quizScore').textContent = `得分 ${quizScore} / ${quizAsked}`;
  if(quizIndex >= quizOrder.length) quizOrder = shuffle(quizOrder), quizIndex = 0;
  const idx = quizOrder[quizIndex];
  const [w,pos,meaning] = WORDS[idx];
  document.getElementById('quizMeaning').textContent = meaning;
  document.getElementById('quizPos').textContent = pos;
  document.getElementById('quizInput').focus();
}
function submitQuiz(){
  const idx = quizOrder[quizIndex];
  const answer = WORDS[idx][0];
  const input = document.getElementById('quizInput').value.trim().toLowerCase();
  const fb = document.getElementById('quizFeedback');
  if(!input) return;
  quizAsked++;
  if(input === answer.toLowerCase()){
    quizScore++;
    fb.textContent = '回答正确！';
    fb.className = 'quiz-feedback correct';
    mastered.add(idx);
    updateStats();
    renderList();
  } else {
    fb.textContent = `不对哦，正确答案是：${answer}`;
    fb.className = 'quiz-feedback wrong';
  }
  document.getElementById('quizScore').textContent = `得分 ${quizScore} / ${quizAsked}`;
  quizIndex++;
  setTimeout(showQuiz, input === answer.toLowerCase() ? 700 : 1600);
}
document.getElementById('quizSubmit').addEventListener('click', submitQuiz);
document.getElementById('quizInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') submitQuiz();
});
document.getElementById('quizNext').addEventListener('click', ()=>{
  quizIndex++;
  showQuiz();
});

/* ---- Tabs ---- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='quiz' && quizOrder.length===0) initQuiz();
  });
});

/* ---- Init ---- */
updateStats();
initFlash();
renderList();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
